<!doctype html>
<html lang="zh-CN" data-theme="light" class="tp-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>TokenPulse</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="tray-panel.css">
  <script src="tray-panel-theme.js"></script>
</head>
<body class="tp-body">
<div id="tp" class="tp" role="dialog" aria-label="官方额度">
  <div class="tp-head">
    <span class="brand-mark tp-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle class="brand-track" cx="12" cy="12" r="7.5"/><path class="brand-progress" d="M7.9 5.7A7.5 7.5 0 0 1 17.6 17"/><rect class="brand-bar" x="7.8" y="13.2" width="2" height="3.8" rx="1"/><rect class="brand-bar" x="11" y="10.8" width="2" height="6.2" rx="1"/><rect class="brand-bar" x="14.2" y="8" width="2" height="9" rx="1"/><circle class="brand-node" cx="17.6" cy="17" r="1.5"/></svg></span>
    <div class="tp-title">
      <b translate="no">TokenPulse</b>
      <small id="tp-today" translate="no"></small>
    </div>
    <button id="tp-refresh" class="tp-icon-btn" type="button" title="立即刷新" aria-label="立即刷新">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.3 4.6l1.7-2.1M20 20v-4.5h-4.5"/></svg>
    </button>
    <button id="tp-quit" class="tp-icon-btn quit" type="button" title="退出 TokenPulse" aria-label="退出 TokenPulse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8M7 6.6a7.5 7.5 0 1 0 10 0"/></svg>
    </button>
  </div>
  <div id="tp-list" class="tp-list" role="list"></div>
  <div id="tp-agents"></div>
  <div class="tp-foot">
    <button id="tp-open" class="btn btn-accent" type="button">打开 TokenPulse</button>
  </div>
</div>
<script src="i18n.js"></script>
<script src="brand.js"></script>
<script src="tray-panel.js"></script>
</body>
</html>
